<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cronograma de Rotina com Alertas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Animação suave de pulsar para o alerta Urgente */
    @keyframes pulsar {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    .animar-urgente {
      animation: pulsar 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen p-4 md:p-8">
  <div class="max-w-5xl mx-auto bg-white shadow-xl rounded-2xl p-6 border border-slate-100">
    
    <!-- Cabeçalho -->
    <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-6 mb-6">
      <div>
        <div class="flex items-center gap-2">
          <span class="text-3xl">⏰</span>
          <h1 class="text-2xl font-black text-slate-900 tracking-tight">Meu Cronograma de Rotina</h1>
        </div>
        <p class="text-sm text-slate-500 mt-1">Clique para editar, defina o nível de urgência e mantenha o foco.</p>
      </div>
      <div class="flex gap-2">
        <button 
          onclick="adicionarItem()" 
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition-all duration-200 shadow-lg shadow-indigo-100 hover:shadow-indigo-200 flex items-center gap-2"
        >
          <span>+</span> Novo Horário
        </button>
      </div>
    </header>

    <!-- Resumo de Alertas Rápidos -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-emerald-50 border border-emerald-100 p-3 rounded-xl flex items-center justify-between">
        <span class="text-xs font-semibold text-emerald-800 uppercase">Normal</span>
        <span id="contador-normal" class="bg-emerald-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">0</span>
      </div>
      <div class="bg-amber-50 border border-amber-100 p-3 rounded-xl flex items-center justify-between">
        <span class="text-xs font-semibold text-amber-800 uppercase">Atenção</span>
        <span id="contador-atencao" class="bg-amber-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">0</span>
      </div>
      <div class="bg-rose-50 border border-rose-100 p-3 rounded-xl flex items-center justify-between">
        <span class="text-xs font-semibold text-rose-800 uppercase">Urgente 🔥</span>
        <span id="contador-urgente" class="bg-rose-500 text-white text-xs font-bold px-2.5 py-1 rounded-full">0</span>
      </div>
    </div>

    <!-- Tabela -->
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[700px]">
        <thead>
          <tr class="text-slate-400 text-xs uppercase tracking-wider border-b">
            <th class="py-3 px-3 w-12 text-center">Alerta</th>
            <th class="py-3 px-3 w-36">Horário</th>
            <th class="py-3 px-3">Atividade / Descrição</th>
            <th class="py-3 px-3 w-36">Categoria</th>
            <th class="py-3 px-3 w-40">Prioridade / Alerta</th>
            <th class="py-3 px-3 w-12 text-center">Deletar</th>
          </tr>
        </thead>
        <tbody id="lista-rotina" class="divide-y divide-slate-100">
          <!-- Linhas renderizadas dinamicamente pelo JavaScript -->
        </tbody>
      </table>
    </div>

    <div class="mt-6 pt-4 border-t text-center text-xs text-slate-400">
      💡 Seus dados são salvos automaticamente no navegador (Local Storage).
    </div>

  </div>

  <script>
    const CHAVE_STORAGE = 'rotina_cronograma_com_alertas_v2';

    const rotinaPadrao = [
      { id: 1, horario: '07:00 - 07:30', atividade: 'Alongamento & Café da manhã', categoria: 'Saúde', prioridade: 'normal' },
      { id: 2, horario: '08:00 - 12:00', atividade: 'Entrega do Projeto Importante', categoria: 'Trabalho', prioridade: 'urgente' },
      { id: 3, horario: '12:00 - 13:00', atividade: 'Almoço e descansar um pouco', categoria: 'Pausa', prioridade: 'normal' },
      { id: 4, horario: '14:00 - 15:30', atividade: 'Revisar e responder e-mails acumulados', categoria: 'Trabalho', prioridade: 'atencao' }
    ];

    let itens = JSON.parse(localStorage.getItem(CHAVE_STORAGE)) || rotinaPadrao;

    function salvar() {
      localStorage.setItem(CHAVE_STORAGE, JSON.stringify(itens));
      atualizarContadores();
    }

    function atualizarContadores() {
      const normal = itens.filter(i => i.prioridade === 'normal').length;
      const atencao = itens.filter(i => i.prioridade === 'atencao').length;
      const urgente = itens.filter(i => i.prioridade === 'urgente').length;

      document.getElementById('contador-normal').innerText = normal;
      document.getElementById('contador-atencao').innerText = atencao;
      document.getElementById('contador-urgente').innerText = urgente;
    }

    function obterEstiloPrioridade(prioridade) {
      switch (prioridade) {
        case 'atencao':
          return {
            bgRow: 'hover:bg-amber-50/40 bg-amber-50/10',
            badge: '⚡',
            selectClass: 'bg-amber-100 text-amber-800 border-amber-300',
            alertaVisual: '🟠'
          };
        case 'urgente':
          return {
            bgRow: 'hover:bg-rose-50/40 bg-rose-50/20 animar-urgente',
            badge: '🔥',
            selectClass: 'bg-rose-100 text-rose-800 border-rose-300 font
